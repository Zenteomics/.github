  <title id="title">Zenteomics</title>
  <desc id="description">Raw data specks on the left gather into a circuit trace that carries the words DATA TO in Morse code to the Zenteomics Z at the centre; a second trace leaves it carrying CLARITY. Dots are nodes and dashes are pads; the mark next to the Z on each side is amber.</desc>
